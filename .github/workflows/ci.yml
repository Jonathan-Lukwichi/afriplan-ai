name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── DXF pipeline: deterministic, no network ───────────────────────
  dxf-pipeline:
    name: DXF pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run DXF unit tests
        run: pytest tests/dxf_pipeline/ -v --tb=short
      - name: Architectural independence
        run: pytest tests/architecture/ -v --tb=short

  # ── PDF pipeline: mocked LLM, no network ──────────────────────────
  pdf-pipeline:
    name: PDF pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run PDF unit tests with mocked Anthropic client
        # No ANTHROPIC_API_KEY in CI — the conftest provides MockAnthropic
        run: pytest tests/pdf_pipeline/ -v --tb=short

  # ── Comparison + shared models ────────────────────────────────────
  comparison:
    name: Comparison + shared models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dxf-pipeline, pdf-pipeline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run comparison tests
        run: pytest tests/comparison/ -v --tb=short

  # ── Evaluation, audit, ML dataset, shared spec, sourcing ──────────
  evaluation-audit:
    name: Evaluation + audit layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run evaluation / audit / shared tests
        # Wedela raw files are gitignored client data: tests that need them skip in CI.
        run: pytest tests/evaluation_layer tests/audit_layer tests/ml_layer tests/shared tests/eval tests/sourcing_layer -v --tb=short
