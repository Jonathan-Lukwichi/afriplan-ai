# CI: the server-side half of "CI + a PostToolUse hook" (CLAUDE.md hard rules 1-3).
# The hook (scripts/hooks/check_architecture.py) only fires inside local Claude Code
# sessions; this runs the same rules on every push, whoever or whatever made the change.
# A fresh clone has no client data (ADR-0005), so the tests that need it skip themselves.

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      # Its own step so a broken boundary is named in the run summary.
      - name: Architecture rules (pipeline independence, read-only layers)
        run: python -m pytest tests/architecture -q -p no:warnings
      - name: Test suite
        run: python -m pytest -q -p no:warnings --ignore=tests/architecture

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  client-data:
    name: No client data or secrets tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The repo is PUBLIC (hard rule 9, ADR-0005): mirrors the .gitignore client-data rules.
      - run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env$|^api/data/|^data/ml/|^data/.*/raw/|^data/projects/[^/]+/(reference_boq|ratio_model)\.json$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Client data or secrets are tracked in git (ADR-0005):"
            echo "$leaked"
            exit 1
          fi
          echo "No client data or secrets tracked."
